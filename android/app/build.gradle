plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fedesierra.gympro'
    compileSdk 34

    defaultConfig {
        applicationId "com.fedesierra.gympro"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "1.4.1"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
